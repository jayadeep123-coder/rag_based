services:
  - type: web
    name: ai-mentor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: EMBED_DIM
        value: "768"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_PDF_SIZE_MB
        value: "10"
      - key: MAX_DOCS_PER_USER
        value: "5"
      - key: MAX_QUESTIONS_PER_USER_PER_DAY
        value: "50"
      - key: MAX_QUESTION_LENGTH
        value: "1000"
      - key: SIMILARITY_THRESHOLD
        value: "0.45"
      - key: TOP_K
        value: "6"
